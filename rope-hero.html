<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Storm Rope Hero | Thunder Zone</title><style>body{background:#101722;color:#fff;font:18px system-ui;text-align:center}canvas{width:min(95vw,720px);height:auto;touch-action:none;border:2px solid #8795aa;border-radius:12px}button{padding:15px;margin:5px;background:#263c50;color:white;border:1px solid #789;border-radius:8px}a{color:#aef}</style><h1>Storm Rope Hero</h1><a href="index.html">Home</a><p>Hold Action to swing, release to glide. Left/right steer.</p><canvas id="c" width="720" height="480"></canvas><p id="s"></p><div><button id="left">◀</button><button id="act">Action</button><button id="right">▶</button><button onclick="location.reload()">Restart</button></div><script>const c=document.querySelector('canvas'),g=c.getContext('2d'),s=document.querySelector('#s'),K={};onkeydown=e=>{K[e.key]=true;if(e.key.startsWith('Arrow')||e.key===' ')e.preventDefault()};onkeyup=e=>K[e.key]=false;for(const [id,k] of [['left','ArrowLeft'],['right','ArrowRight'],['act',' ']]){let b=document.getElementById(id);b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);K[k]=true};b.onpointerup=b.onpointercancel=()=>K[k]=false}function disk(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill()}function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}function text(t,x,y){g.fillStyle='white';g.font='20px system-ui';g.fillText(t,x,y)}function pos(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*720/r.width,(e.clientY-r.top)*480/r.height]}let x=100,y=200,vx=3,vy=0,anchor=0,score=0;function loop(){let a=Math.floor((x+100)/220)*220+100;if(K[' ']){let dx=a-x,dy=70-y,d=Math.hypot(dx,dy)||1;vx+=dx/d*.25;vy+=dy/d*.25}vy+=.12;vx+=K.ArrowRight?.12:K.ArrowLeft?-.12:0;vx=Math.max(1,Math.min(9,vx));x+=vx;y+=vy;if(y>440){y=200;vy=0;vx=3;x=100}rect(0,0,720,480,'#23354c');for(let i=-1;i<7;i++){let b=Math.floor(x/130)+i,xx=b*130-x+150,hh=150+80*Math.sin(b*2);rect(xx,480-hh,105,hh,'#455567');for(let k=0;k<5;k++)for(let j=0;j<3;j++)rect(xx+10+j*28,490-hh+k*25,12,14,'#d9b86b')}if(K[' ']){g.strokeStyle='#eee';g.beginPath();g.moveTo(150,y);g.lineTo(a-x+150,70);g.stroke()}disk(150,y,12,'#efb889');rect(142,y+10,16,24,'#b53d37');text('Distance '+Math.floor(x),20,30);requestAnimationFrame(loop)}loop();</script></html>
