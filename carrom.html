<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Royal Carrom | Thunder Zone</title><style>body{background:#101722;color:#fff;font:18px system-ui;text-align:center}canvas{width:min(95vw,720px);height:auto;touch-action:none;border:2px solid #8795aa;border-radius:12px}button{padding:15px;margin:5px;background:#263c50;color:white;border:1px solid #789;border-radius:8px}a{color:#aef}</style><h1>Royal Carrom</h1><a href="index.html">Home</a><p>Drag from striker toward a coin and release to shoot.</p><canvas id="c" width="720" height="480"></canvas><p id="s"></p><div><button id="left">◀</button><button id="act">Action</button><button id="right">▶</button><button onclick="location.reload()">Restart</button></div><script>const c=document.querySelector('canvas'),g=c.getContext('2d'),s=document.querySelector('#s'),K={};onkeydown=e=>{K[e.key]=true;if(e.key.startsWith('Arrow')||e.key===' ')e.preventDefault()};onkeyup=e=>K[e.key]=false;for(const [id,k] of [['left','ArrowLeft'],['right','ArrowRight'],['act',' ']]){let b=document.getElementById(id);b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);K[k]=true};b.onpointerup=b.onpointercancel=()=>K[k]=false}function disk(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill()}function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}function text(t,x,y){g.fillStyle='white';g.font='20px system-ui';g.fillText(t,x,y)}function pos(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*720/r.width,(e.clientY-r.top)*480/r.height]}let balls=[{x:360,y:390,vx:0,vy:0,r:13,c:'#eee'}];for(let i=0;i<12;i++)balls.push({x:360+35*Math.cos(i*2.4),y:240+35*Math.sin(i*2.4),vx:0,vy:0,r:10,c:i%2?'#34271e':'#e5c69b'});let start=null,score=0;c.onpointerdown=e=>start=pos(e);c.onpointerup=e=>{if(!start)return;let [x,y]=pos(e);balls[0].vx=(x-start[0])*.09;balls[0].vy=(y-start[1])*.09;start=null};function loop(){rect(0,0,720,480,'#56351e');rect(35,35,650,410,'#d8ae76');let holes=[[55,55],[665,55],[55,425],[665,425]];for(let [x,y] of holes)disk(x,y,20,'#24180f');for(let b of balls){b.x+=b.vx;b.y+=b.vy;b.vx*=.985;b.vy*=.985;if(b.x<48||b.x>672)b.vx*=-1;if(b.y<48||b.y>432)b.vy*=-1;b.x=Math.max(48,Math.min(672,b.x));b.y=Math.max(48,Math.min(432,b.y))}for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){let a=balls[i],b=balls[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d>0&&d<a.r+b.r){let nx=dx/d,ny=dy/d,v=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;if(v>0){a.vx-=v*nx;a.vy-=v*ny;b.vx+=v*nx;b.vy+=v*ny}b.x+=nx*(a.r+b.r-d);b.y+=ny*(a.r+b.r-d)}}balls=balls.filter((b,i)=>{if(i&&holes.some(([x,y])=>Math.hypot(x-b.x,y-b.y)<19)){score++;return false}return true});for(let b of balls)disk(b.x,b.y,b.r,b.c);s.textContent='Pocketed '+score+' / 12';requestAnimationFrame(loop)}loop();</script></html>
