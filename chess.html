<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thunder Chess | Thunder Zone</title><style>body{background:#101722;color:#fff;font:18px system-ui;text-align:center}canvas{width:min(95vw,720px);height:auto;touch-action:none;border:2px solid #8795aa;border-radius:12px}button{padding:15px;margin:5px;background:#263c50;color:white;border:1px solid #789;border-radius:8px}a{color:#aef}</style><h1>Thunder Chess</h1><a href="index.html">Home</a><p>Two players on one device. Select a piece and destination.</p><canvas id="c" width="720" height="480"></canvas><p id="s"></p><div><button id="left">◀</button><button id="act">Action</button><button id="right">▶</button><button onclick="location.reload()">Restart</button></div><script>const c=document.querySelector('canvas'),g=c.getContext('2d'),s=document.querySelector('#s'),K={};onkeydown=e=>{K[e.key]=true;if(e.key.startsWith('Arrow')||e.key===' ')e.preventDefault()};onkeyup=e=>K[e.key]=false;for(const [id,k] of [['left','ArrowLeft'],['right','ArrowRight'],['act',' ']]){let b=document.getElementById(id);b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);K[k]=true};b.onpointerup=b.onpointercancel=()=>K[k]=false}function disk(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill()}function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}function text(t,x,y){g.fillStyle='white';g.font='20px system-ui';g.fillText(t,x,y)}function pos(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*720/r.width,(e.clientY-r.top)*480/r.height]}let board;import('https://cdn.jsdelivr.net/npm/chess.js@1.4.0/dist/esm/chess.js').then(({Chess})=>{let game=new Chess(),sel=null, glyph={p:'♟',r:'♜',n:'♞',b:'♝',q:'♛',k:'♚',P:'♙',R:'♖',N:'♘',B:'♗',Q:'♕',K:'♔'};function draw(){rect(0,0,720,480,'#32251b');let b=game.board();for(let y=0;y<8;y++)for(let x=0;x<8;x++){let sq='abcdefgh'[x]+(8-y);rect(120+x*60,y*60,60,60,sel===sq?'#bca64c':(x+y)%2?'#95643e':'#f0d7ac');let p=b[y][x];if(p){g.font='48px serif';g.fillStyle=p.color==='w'?'#fff':'#181818';g.fillText(glyph[p.color==='w'?p.type.toUpperCase():p.type],125+x*60,48+y*60)}}s.textContent=game.isGameOver()?'Game over':(game.turn()==='w'?'White':'Black')+' to move'}c.onclick=e=>{let [x,y]=pos(e);x=Math.floor((x-120)/60);y=Math.floor(y/60);if(x<0||x>7||y<0||y>7)return;let sq='abcdefgh'[x]+(8-y);if(sel){try{game.move({from:sel,to:sq,promotion:'q'});sel=null}catch{sel=sq}}else sel=sq;draw()};draw()}).catch(()=>s.textContent='Chess needs internet to load its rules engine.');</script></html>
