<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thunder Hill Climb | Thunder Zone</title><style>body{background:#101722;color:#fff;font:18px system-ui;text-align:center}canvas{width:min(95vw,720px);height:auto;touch-action:none;border:2px solid #8795aa;border-radius:12px}button{padding:15px;margin:5px;background:#263c50;color:white;border:1px solid #789;border-radius:8px}a{color:#aef}</style><h1>Thunder Hill Climb</h1><a href="index.html">Home</a><p>Hold right to accelerate, left to brake. Collect fuel along the hills.</p><canvas id="c" width="720" height="480"></canvas><p id="s"></p><div><button id="left">◀</button><button id="act">Action</button><button id="right">▶</button><button onclick="location.reload()">Restart</button></div><script>const c=document.querySelector('canvas'),g=c.getContext('2d'),s=document.querySelector('#s'),K={};onkeydown=e=>{K[e.key]=true;if(e.key.startsWith('Arrow')||e.key===' ')e.preventDefault()};onkeyup=e=>K[e.key]=false;for(const [id,k] of [['left','ArrowLeft'],['right','ArrowRight'],['act',' ']]){let b=document.getElementById(id);b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);K[k]=true};b.onpointerup=b.onpointercancel=()=>K[k]=false}function disk(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill()}function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}function text(t,x,y){g.fillStyle='white';g.font='20px system-ui';g.fillText(t,x,y)}function pos(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*720/r.width,(e.clientY-r.top)*480/r.height]}let x=0,v=0,fuel=100;const h=x=>340+55*Math.sin(x/95)+25*Math.sin(x/43);function loop(){if(fuel>0){v=Math.max(0,Math.min(7,v+(K.ArrowRight?.12:K.ArrowLeft?-.2:-.025)));x+=v;fuel-=v*.006;if(Math.floor(x/600)>Math.floor((x-v)/600))fuel=Math.min(100,fuel+25)}let sky=g.createLinearGradient(0,0,0,480);sky.addColorStop(0,'#24435c');sky.addColorStop(1,'#c4bda0');rect(0,0,720,480,sky);for(let j=0;j<3;j++){g.fillStyle=['#697d83','#526e69','#354b40'][j];g.beginPath();g.moveTo(0,480);for(let i=0;i<=720;i+=5)g.lineTo(i,260+j*30+45*Math.sin((i+x*.15*(j+1))/100+j));g.lineTo(720,480);g.fill()}g.fillStyle='#796044';g.beginPath();g.moveTo(0,480);for(let i=0;i<=720;i+=3)g.lineTo(i,h(x+i-150));g.lineTo(720,480);g.fill();g.save();g.translate(150,h(x)-23);g.rotate(Math.atan2(h(x+20)-h(x-20),40));rect(-32,-17,64,24,'#a83224');rect(-12,-33,32,18,'#b5d8e3');disk(-22,8,13,'#202020');disk(22,8,13,'#202020');disk(-22,8,5,'#aaa');disk(22,8,5,'#aaa');g.restore();text('Distance '+Math.floor(x/10)+' m | Fuel '+Math.floor(fuel),20,30);if(fuel<=0)text('Out of fuel — restart',240,100);requestAnimationFrame(loop)}loop();</script></html>
