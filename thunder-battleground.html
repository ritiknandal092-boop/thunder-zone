<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thunder Battleground: Storm Escape | Thunder Zone</title><style>body{background:#101722;color:#fff;font:18px system-ui;text-align:center}canvas{width:min(95vw,720px);height:auto;touch-action:none;border:2px solid #8795aa;border-radius:12px}button{padding:15px;margin:5px;background:#263c50;color:white;border:1px solid #789;border-radius:8px}a{color:#aef}</style><h1>Thunder Battleground: Storm Escape</h1><a href="index.html">Home</a><p>Move with arrows or tap the map. Collect supplies and stay inside the storm circle.</p><canvas id="c" width="720" height="480"></canvas><p id="s"></p><div><button id="left">◀</button><button id="act">Action</button><button id="right">▶</button><button onclick="location.reload()">Restart</button></div><script>const c=document.querySelector('canvas'),g=c.getContext('2d'),s=document.querySelector('#s'),K={};onkeydown=e=>{K[e.key]=true;if(e.key.startsWith('Arrow')||e.key===' ')e.preventDefault()};onkeyup=e=>K[e.key]=false;for(const [id,k] of [['left','ArrowLeft'],['right','ArrowRight'],['act',' ']]){let b=document.getElementById(id);b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);K[k]=true};b.onpointerup=b.onpointercancel=()=>K[k]=false}function disk(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill()}function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}function text(t,x,y){g.fillStyle='white';g.font='20px system-ui';g.fillText(t,x,y)}function pos(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*720/r.width,(e.clientY-r.top)*480/r.height]}let x=360,y=240,r=225,t=0,score=0,goal=null,items=Array.from({length:20},()=>[100+Math.random()*520,60+Math.random()*360]);c.onpointerdown=e=>goal=pos(e);function loop(){t++;r=Math.max(45,225-t/40);if(K.ArrowLeft)x-=2;if(K.ArrowRight)x+=2;if(K.ArrowUp||K[' '])y-=2;if(K.ArrowDown)y+=2;if(goal){let dx=goal[0]-x,dy=goal[1]-y,d=Math.hypot(dx,dy);if(d>3){x+=dx/d*2;y+=dy/d*2}}rect(0,0,720,480,'#263f35');for(let i=0;i<30;i++){let a=(i*137)%720,b=(i*83)%480;disk(a,b,15,'#45684a')}g.strokeStyle='#67c9ff';g.lineWidth=5;g.beginPath();g.arc(360,240,r,0,7);g.stroke();items=items.filter(([a,b])=>{if(Math.hypot(a-x,b-y)<18){score++;return false}rect(a-5,b-5,10,10,'#f4d57a');return true});disk(x,y,10,'#fff');text('Supplies '+score+' | Storm '+Math.floor(r),15,25);if(Math.hypot(x-360,y-240)>r){text('Storm caught you — restart',200,240);return}requestAnimationFrame(loop)}loop();</script></html>
